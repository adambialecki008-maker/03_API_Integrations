[project]
name = "api-integrations"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.162.2",
    "httpx>=0.28.1",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
cache_dir = ".pytest_cache"
testpaths = ["tests"]